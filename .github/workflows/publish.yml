name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AB17B8: ${{ secrets.AB17B8 }}
          B89059: ${{ secrets.B89059 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('AB17B8', '')
          bm = os.environ.get('B89059', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 85dcd1c6696cd58dfc872a7c2f12bffea635bd -->', gm)
          if bm:
              s2 = s2.replace('<!-- 21696dd18638172c8b4c007ceea70381645d0c -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
